<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${departamento.id == null} ? 'Nuevo Departamento' : 'Editar Departamento'">Departamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0" th:text="${departamento.id == null} ? 'Nuevo Departamento' : 'Editar Departamento'"></h4>
                </div>
                <div class="card-body">
                    <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

                    <form th:action="${departamento.id == null} ? @{/departamentos/guardar} : @{/departamentos/{id}/actualizar(id=${departamento.id})}"
                          th:object="${departamento}" method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="ubicacion" class="form-label">Ubicación</label>
                            <input type="text" id="ubicacion" class="form-control" th:field="*{ubicacion}"
                                   th:classappend="${#fields.hasErrors('ubicacion')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{ubicacion}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="presupuesto" class="form-label">Presupuesto</label>
                            <input type="number" step="0.01" id="presupuesto" class="form-control" th:field="*{presupuesto}"
                                   th:classappend="${#fields.hasErrors('presupuesto')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{presupuesto}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/departamentos}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

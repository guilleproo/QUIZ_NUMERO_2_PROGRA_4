<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Departamentos</h2>
        <a th:href="@{/departamentos/nuevo}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            Nuevo Departamento
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th class="text-end">Presupuesto</th>
                <th class="text-center">Empleados</th>
                <th class="text-end">Total Planilla</th>
                <th class="text-end">Presupuesto Disponible</th>
                <th class="text-center" sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept : ${departamentos}">
                <td th:text="${dept.nombre}"></td>
                <td th:text="${dept.ubicacion}"></td>
                <td class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(dept.presupuesto != null ? dept.presupuesto : 0, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-center">
                    <a th:href="@{/empleados(departamentoId=${dept.id})}"
                       th:text="${cantidades[dept.id] != null ? cantidades[dept.id] : 0}"
                       class="badge text-bg-info text-decoration-none"></a>
                </td>
                <td class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(planillas[dept.id] != null ? planillas[dept.id] : 0, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(disponibles[dept.id] != null ? disponibles[dept.id] : 0, 1, 'COMMA', 2, 'POINT')}"
                    th:classappend="${disponibles[dept.id] != null and disponibles[dept.id] < 0} ? 'text-danger fw-bold' : 'text-success fw-bold'"></td>
                <td class="text-center" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/departamentos/{id}/editar(id=${dept.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/departamentos/{id}/eliminar(id=${dept.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Deseas eliminar este departamento?');">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departamentos)}">
                <td colspan="7" class="text-center text-muted">No hay departamentos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

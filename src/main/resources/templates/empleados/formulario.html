<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${empleado.id == null} ? 'Nuevo Empleado' : 'Editar Empleado'">Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0" th:text="${empleado.id == null} ? 'Nuevo Empleado' : 'Editar Empleado'"></h4>
                </div>
                <div class="card-body">
                    <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

                    <form th:action="${empleado.id == null} ? @{/empleados/guardar} : @{/empleados/{id}/actualizar(id=${empleado.id})}"
                          th:object="${empleado}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="cedula" class="form-label">Cédula</label>
                                <input type="text" id="cedula" class="form-control" th:field="*{cedula}"
                                       th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{cedula}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="text" id="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="departamentoSelect" class="form-label">Departamento</label>
                                <select id="departamentoSelect" name="departamentoId" class="form-select"
                                        th:classappend="${#fields.hasErrors('departamento')} ? 'is-invalid'">
                                    <option value="">Seleccione un departamento</option>
                                    <option th:each="dept : ${departamentos}"
                                            th:value="${dept.id}"
                                            th:text="${dept.nombre}"
                                            th:selected="${(departamentoId != null and departamentoId == dept.id) or (empleado.departamento != null and empleado.departamento.id == dept.id)}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{departamento}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="puesto" class="form-label">Puesto</label>
                                <select id="puesto" class="form-select" th:field="*{puesto}"
                                        th:classappend="${#fields.hasErrors('puesto')} ? 'is-invalid'">
                                    <option value="">Seleccione un puesto</option>
                                    <option th:each="p : ${puestos}"
                                            th:value="${p}"
                                            th:text="${p}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{puesto}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="salario" class="form-label">Salario</label>
                                <input type="number" step="0.01" id="salario" class="form-control" th:field="*{salario}"
                                       th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{salario}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="fechaIngreso" class="form-label">Fecha de ingreso</label>
                                <input type="date" id="fechaIngreso" class="form-control" th:field="*{fechaIngreso}"
                                       th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

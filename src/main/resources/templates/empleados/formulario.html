<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'crear'} ? 'Nueva mascota' : 'Editar mascota'">Mascota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h4 th:text="${modo == 'crear'} ? 'Nueva mascota' : 'Editar mascota'"></h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:object="${mascota}" method="post"
          th:action="${modo == 'crear'} ? @{/mascotas/guardar} : @{/mascotas/{id}/actualizar(id=${mascota.id})}">

        <div class="mb-3">
            <label class="form-label">Dueño</label>
            <select name="usuarioId" class="form-select" required>
                <option value="">-- Seleccione un dueño --</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.id}"
                        th:text="${u.nombre} + ' (' + ${u.username} + ')'"
                        th:selected="${u.id == usuarioId}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Especie</label>
            <select th:field="*{especie}" class="form-select"
                    th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid'">
                <option value="">-- Seleccione --</option>
                <option th:each="e : ${especies}" th:value="${e}" th:text="${e.etiqueta}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{especie}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Raza <span class="text-muted">(opcional)</span></label>
            <input type="text" th:field="*{raza}" class="form-control"
                   th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{raza}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/mascotas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>

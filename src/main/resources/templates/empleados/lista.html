<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="d-flex align-items-center gap-3">
        <span class="navbar-brand">Gestion</span>
        <a class="nav-link text-white-50" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        <a class="nav-link text-white" th:href="@{/mascotas}">Mascotas</a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white">Hola, <b sec:authentication="name"></b></span>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">
            <span th:if="${dueno == null}">Todas las mascotas</span>
            <span th:if="${dueno != null}" th:text="'Mascotas de ' + ${dueno.nombre}"></span>
        </h4>
        <div class="d-flex gap-2">
            <a th:if="${dueno != null}" th:href="@{/mascotas}" class="btn btn-outline-secondary">Ver todas</a>
            <a sec:authorize="hasRole('ADMIN')"
               th:href="${dueno != null} ? @{/mascotas/nuevo(usuarioId=${dueno?.id})} : @{/mascotas/nuevo}"
               class="btn btn-primary">+ Nueva mascota</a>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Especie</th><th>Raza</th><th>Nacimiento</th><th>Dueño</th>
            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${mascotas}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.nombre}"></td>
            <td><span class="badge bg-info text-dark" th:text="${m.especie.etiqueta}"></span></td>
            <td th:text="${#strings.isEmpty(m.raza)} ? '—' : ${m.raza}"></td>
            <td th:text="${#temporals.format(m.fechaNacimiento, 'dd/MM/yyyy')}"></td>
            <td>
                <a th:href="@{/mascotas(usuarioId=${m.usuario.id})}" th:text="${m.usuario.nombre}"></a>
            </td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/mascotas/{id}/editar(id=${m.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/mascotas/{id}/eliminar(id=${m.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Eliminar esta mascota?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(mascotas)}">
            <td colspan="7" class="text-center text-muted">No hay mascotas registradas</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

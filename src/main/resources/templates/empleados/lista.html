<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Empleados</h2>
        <a th:href="${departamentoIdSeleccionado != null} ? @{/empleados/nuevo(departamentoId=${departamentoIdSeleccionado})} : @{/empleados/nuevo}"
           class="btn btn-primary"
           sec:authorize="hasRole('ADMIN')">
            Nuevo Empleado
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <form th:action="@{/empleados}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-4">
            <label for="departamentoId" class="form-label">Filtrar por departamento</label>
            <select id="departamentoId" name="departamentoId" class="form-select">
                <option value="">Todos los departamentos</option>
                <option th:each="dept : ${departamentos}"
                        th:value="${dept.id}"
                        th:text="${dept.nombre}"
                        th:selected="${departamentoIdSeleccionado != null and departamentoIdSeleccionado == dept.id}">
                </option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
            <a th:href="@{/empleados}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Correo</th>
                <th>Departamento</th>
                <th>Puesto</th>
                <th class="text-end">Salario</th>
                <th class="text-center">Fecha Ingreso</th>
                <th class="text-center" sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${empleados}">
                <td th:text="${emp.nombre}"></td>
                <td th:text="${emp.cedula}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.departamento != null ? emp.departamento.nombre : '-'}"></td>
                <td th:text="${emp.puesto}"></td>
                <td class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(emp.salario != null ? emp.salario : 0, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-center"
                    th:text="${emp.fechaIngreso != null ? #temporals.format(emp.fechaIngreso, 'dd/MM/yyyy') : '-'}"></td>
                <td class="text-center" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/empleados/{id}/editar(id=${emp.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/empleados/{id}/eliminar(id=${emp.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Deseas eliminar este empleado?');">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="8" class="text-center text-muted">No hay empleados registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
